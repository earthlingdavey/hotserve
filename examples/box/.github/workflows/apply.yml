# Checks every box's Caddyfile on every push and pull request, with the
# latest stable motel release (or the one each box's MOTEL_VERSION
# file names); on a push to main, also sends HEAD to each box
# (bin/apply). A box applies it only if this workflow's token names
# this repository's main, and a key the box lists signed every commit
# since the one it runs. Nothing secret is stored here.
name: apply
on: [push, pull_request]

permissions:
  contents: read

env:
  # Empty: the latest stable release (bin/install-motel). The
  # repository variable pins one instead, for every box at once (its
  # form: 0.3.0, or 0.3.0-rc1 for a candidate; examples of the format,
  # not releases to pin); a box on a release of its own has a
  # MOTEL_VERSION file beside its Caddyfile instead (README.md, "A
  # box on another release"), and the file wins for that box.
  MOTEL_VERSION: ${{ vars.MOTEL_VERSION }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install motel (each release the boxes need, bare binaries)
        run: bin/install-motel
      - run: make check

  # Not after check: each box validates what it is sent, and one box's
  # broken file must not hold another box's fix back.
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the token each box's deploy_trust checks
    # One run at a time, never cancelled mid-push. A run waiting behind
    # this one sends its own HEAD, which carries this one's commits.
    concurrency:
      group: apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit between the one each box runs and HEAD goes in
          # its bundle.
          fetch-depth: 0
          persist-credentials: false
      # bin/apply needs it only to read each box's address from its
      # Caddyfile, which any release with `box` reads alike: the default
      # alone, so that one box's MOTEL_VERSION file cannot hold the
      # others' pushes back.
      - name: Install motel (the release's bare binary)
        run: bin/install-motel default
      - run: bin/apply
