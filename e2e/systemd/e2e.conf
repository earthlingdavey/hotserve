# e2e drop-in for the packaged motel unit: the deploy token must
# exist before motel reads its Caddyfile (which trusts the public
# half). Everything else — User=motel, the sandboxing, the
# user@<uid> drop-in postinstall would write — is the production unit
# verbatim, so the suites run against what ships.
[Unit]
Wants=e2e-token.service
After=e2e-token.service
[Service]
# A decoy supervisor secret: the probe release's view probe
# (liveswap/testdata/sandbox-view.sh, via e2e/liveswap/probe-server.sh) asserts it
# never reaches an app's environment.
Environment=ACME_TEST_TOKEN=decoy-e2e-not-a-real-token
