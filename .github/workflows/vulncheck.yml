# Weekly govulncheck sweep: the vulnerability database updates even when
# the code doesn't, so PR-time checks (the govulncheck job in ci.yml)
# aren't enough on their own.
name: vulncheck

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least-privilege token: this workflow only checks out and runs make.
permissions:
  contents: read

env:
  # Node actions on the system store; see ci.yml's env.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - run: make vulncheck COMPOSE="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
