body:
  - type: markdown
    attributes:
      value: |
        A security problem? Please do not post it here — follow
        [SECURITY.md](https://github.com/smallhoursorg/motel/blob/main/SECURITY.md).
  - type: textarea
    attributes:
      label: Your question, problem or report
      description: For a problem, what you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The release you installed, and the output of `motel version`. Skip it if you have not installed motel yet.
  - type: input
    attributes:
      label: Host
      description: Distribution and architecture, e.g. Debian 13, arm64. Skip it if you have not installed motel yet.
  - type: textarea
    attributes:
      label: Journal
      description: Run as root, or as the [administrator](https://github.com/smallhoursorg/motel/blob/main/docs/hardening.md#3-an-administrator-if-you-want-one). The relevant lines from `journalctl -u motel -n 50 --no-pager`, for an app's own output `journalctl -t motel-<app> -n 50 --no-pager`, and for a box push `journalctl -u motel-box-apply -n 50 --no-pager`. Redact secrets.
      render: text
