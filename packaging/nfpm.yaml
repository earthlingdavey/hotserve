# nfpm packaging definition — currently .deb only, run once
# per arch × format by `make package`. Env: NFPM_ARCH, NFPM_VERSION.
#
# No .apk, and no plan for one. Alpine runs OpenRC, and liveswap runs
# apps as transient systemd units with no fallback runner (see
# App.Start), so an Alpine motel would serve — Caddy, cache,
# penaltybox — but refuse any Caddyfile defining an app. An OpenRC
# package would install a motel missing the feature it exists for.
# The raw-binary tarball is for other systemd hosts, not for Alpine.
name: motel
arch: "${NFPM_ARCH}"
platform: linux
version: "${NFPM_VERSION}"
section: web
priority: optional
maintainer: "smallhours <15802017+EarthlingDavey@users.noreply.github.com>"
description: |
  motel — zero-downtime app deploys on one server, powered by Caddy.
  Zero-downtime app deploys (liveswap), rate-limit hint enforcement
  (penaltybox) and HTTP caching (Souin + Otter) in one binary.
vendor: smallhours
homepage: https://github.com/smallhoursorg/motel
license: Apache-2.0

# liveswap runs deployed apps as transient units under the motel
# user's systemd manager (user@<uid>.service). pam_systemd is what
# gives that manager its runtime directory; without libpam-systemd it
# cannot start at all. dbus: loginctl (lingering) needs the system bus.
depends:
  # Every app unit gets PrivatePIDs=, which systemd 257 added
  # (systemd.exec(5)), and no setting runs an app without it. The floor
  # lets apt refuse an older release (Debian 12 and earlier, Ubuntu
  # 24.04) at install. Without it such a box installs and serves the starter
  # page, which leaves liveswap off. The failure would then come only
  # when the box's own config first turns liveswap on, as `motel
  # init`'s reload fails. A version is all apt can see. Whether the
  # kernel permits the namespaces (a container, an LXC VPS, an LSM that
  # refuses them) is still for the sandbox probe to measure when
  # liveswap starts (liveswap/sandbox.go, probeSandboxCapability).
  - systemd (>= 257)
  - libpam-systemd
  - dbus
  # motel-backup runs Debian's restic and sqlite3 in units of its own
  # (backups/README.md). Depends, not Recommends: a provider's image may
  # leave recommended packages out — Hetzner's Debian 13 sets
  # APT::Install-Recommends "false" — and on such a box neither program
  # came, so backups stopped at setup's first line (the owner's box,
  # 2026-10-05). ca-certificates: restic verifies the storage's
  # certificate against /etc/ssl/certs, and Debian's restic does not
  # depend on it; in a bare debian:13 container every request ended
  # `x509: certificate signed by unknown authority`. motel itself
  # reads the same store — ACME to Let's Encrypt, deploy_trust's OIDC
  # discovery and JWKS fetches, a pull over https — and never declared
  # it either; it is the binary's as much as the backups'. The cost: a
  # box that uses no backups carries restic (23 MB) and sqlite3 too;
  # taken over a box that does and cannot, found at setup.
  - restic
  - sqlite3
  - ca-certificates
  # The box applier and the box_webhook handler verify each commit's
  # SSH signature with `ssh-keygen -Y verify` (box/DESIGN-box.md, step
  # 12).
  - openssh-client

# Every entry pins its mode. Without file_info nfpm copies the mode of
# the file on the build host, so the package would carry whatever the
# builder's umask happened to be — `make package` under umask 0002
# shipped /usr/bin/motel group-writable (0775). A permission that
# arrives by accident is one nobody reviewed.
contents:
  # `make package` stages the right arch's binary at this fixed path
  # before each nfpm run (nfpm does not env-expand contents paths).
  - src: build/motel
    dst: /usr/bin/motel
    file_info:
      mode: 0755
  - src: packaging/motel.service
    dst: /lib/systemd/system/motel.service
    file_info:
      mode: 0644
  # The backup program and its units: the hourly run and the Sunday
  # restore drill, enabled by postinstall and running nothing until
  # `motel-backup setup` has written /etc/motel-backup/repository.env,
  # which the package neither ships nor removes (postremove says why).
  - src: build/motel-backup
    dst: /usr/bin/motel-backup
    file_info:
      mode: 0755
  - src: packaging/motel-backup.service
    dst: /lib/systemd/system/motel-backup.service
    file_info:
      mode: 0644
  - src: packaging/motel-backup.timer
    dst: /lib/systemd/system/motel-backup.timer
    file_info:
      mode: 0644
  - src: packaging/motel-backup-drill.service
    dst: /lib/systemd/system/motel-backup-drill.service
    file_info:
      mode: 0644
  - src: packaging/motel-backup-drill.timer
    dst: /lib/systemd/system/motel-backup-drill.timer
    file_info:
      mode: 0644
  # The box applier (box/DESIGN-box.md, "The applier unit"): the path
  # unit postinstall enables, the service it starts, and the exchange
  # tree they share with the handler, made by systemd-tmpfiles at boot
  # and by postinstall.
  - src: packaging/motel-box-apply.path
    dst: /lib/systemd/system/motel-box-apply.path
    file_info:
      mode: 0644
  - src: packaging/motel-box-apply.service
    dst: /lib/systemd/system/motel-box-apply.service
    file_info:
      mode: 0644
  - src: packaging/motel-box.tmpfiles
    dst: /usr/lib/tmpfiles.d/motel-box.conf
    file_info:
      mode: 0644
  # The starter config. It is not a conffile: postinstall installs it
  # at /etc/motel/Caddyfile where nothing stands, replaces it there
  # only while that file is byte-identical to the starter postinstall
  # last wrote (the sha256 in /var/lib/motel-package/starter.sha256),
  # and otherwise never touches it. So an upgrade never asks. As a
  # conffile, a changed starter made dpkg ask on every box whose file
  # `motel init` or a push had written, and Y there replaced the
  # box's config with this one, which no push can reach. ucf asks too,
  # or (forced) never replaces an untouched file; dpkg-maintscript-helper
  # rm_conffile empties the live path mid-upgrade. Neither is used.
  - src: packaging/Caddyfile
    dst: /usr/share/motel/Caddyfile
    file_info:
      mode: 0644
  - dst: /etc/motel
    type: dir
    file_info:
      mode: 0755
  # Root's alone: a record the motel user could write would let a
  # compromised motel make root's next upgrade overwrite the box's
  # config with the starter. Removed whole by `apt purge` (postremove),
  # with /etc/motel/Caddyfile and the box applier's exchange tree.
  - dst: /var/lib/motel-package
    type: dir
    file_info:
      mode: 0700
  # Caddy's state (TLS certificates) and the deployed apps' releases
  # and data. No maintainer script removes either, purge included:
  # dpkg itself removes one only when it is empty, as any directory a
  # package shipped.
  - dst: /var/lib/motel
    type: dir
    file_info:
      mode: 0750
  - dst: /var/lib/liveswap
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  # remove: the manager drops the removed units, the box applier's
  # path unit and the backup timers are masked; purge: their enable
  # state, the box's config, the starter's record, the exchange tree
  # and what motel-backup keeps of its own go — the script's header
  # says what is kept, and why.
  postremove: packaging/postremove.sh
